[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "haa-simple"
version = "0.1.0"
description = "A transparent Streamlit backtester for HAA-Simple"
requires-python = ">=3.9"
dependencies = [
  "streamlit>=1.38",
  "pandas>=2.1",
  "numpy>=1.26",
  "yfinance>=0.2.43",
  "plotly>=5.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
